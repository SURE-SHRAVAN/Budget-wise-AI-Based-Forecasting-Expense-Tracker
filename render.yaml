services:
  # 1. PostgreSQL Database
  - type: pgo
    name: budgetwise-db
    plan: free

  # 2. Django Backend
  - type: web
    name: budgetwise-backend
    env: python
    plan: free
    region: ohio
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: budgetwise-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
    rootDir: backend

  # 3. Vite React Frontend
  - type: web
    name: budgetwise-frontend
    env: static
    plan: free
    region: ohio
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
